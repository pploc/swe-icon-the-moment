# Validates content and the build on pull requests, so a question with bad
# frontmatter (missing title, unknown topic, …) fails the PR instead of the site.
name: CI

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run content:check
      - run: npm run build
